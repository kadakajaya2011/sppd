var L=cairS(selS),cur=L.find(function(c){return c.id==selP})||L[L.length-1],items=S.items.filter(function(i){return i.s==selS}),h='<div class="bar noprint">'+srcSel();

rows+='<tr class="'+(it.silva?"sv":"")+'"><td class="c">'+(i+1)+"</td><td>"+esc(it.u)+'</td><td class="n">'+fmt(it.p)+'</td><td class="n">'+fmt(lalu)+'</td><td class="n"><input class="num'+(bad?" bad":"")+'" value="'+(now?fmt(now):"")+'" placeholder="-" onchange="setReq(\''+it.id+'\',this.value)"><div class="sm noprint">maks '+fmt(mx)+'</div></td><td class="n">'+fmt(jml)+'</td><td class="n'+(bad?" bad":"")+'">'+fmt(sisa)+"</td></tr>"});
var sisaKas=cur.saldo-T[2],warn=sisaKas<0;
return h+'<div class="wrap"><div class="sheet"><h2>SURAT PERMINTAAN PENCAIRAN DANA (SPPD)</h2>'+
'<p class="c">Nomor : '+noSurat(cur)+'</p>'+
'<p class="c"><b>DESA '+esc(S.desa.toUpperCase())+" KECAMATAN "+esc(S.kec.toUpperCase())+"<br>SUMBER DANA: "+esc(sumber(selS).n.toUpperCase())+" ("+esc(selS)+")<br>TAHUN ANGGARAN "+S.tahun+'</b></p>'+

'<table><tr><th>NO</th><th>URAIAN</th><th>PAGU (Rp.)</th><th>PENCAIRAN S.D YANG LALU (Rp.)</th><th>PERMINTAAN SEKARANG (Rp.)</th><th>JUMLAH S.D SAAT INI (Rp.)</th><th>SISA DANA (Rp.)</th></tr>'+rows+
'<tr><th colspan="2">JUMLAH (Rp.)</th>'+T.map(function(v){return'<th class="n">'+fmt(v)+"</th>"}).join("")+"</tr></table>"+
'<table style="margin-top:6px;width:auto"><tr><td>Murni</td><td class="n">'+fmt(murni)+"</td><td>Silva</td><td class=\"n\">"+fmt(silva)+'</td></tr><tr><td>Saldo '+esc(selS)+'</td><td class="n"><input class="num" value="'+(cur.saldo?fmt(cur.saldo):"")+'" placeholder="isi saldo kas" onchange="upd(\'saldo\',num(this.value));render()"></td><td>Sisa</td><td class="n'+(warn?" bad":"")+'">'+fmt(sisaKas)+"</td></tr></table>"+
(warn?'<p class="bad noprint">Permintaan melebihi saldo kas.</p>':"")+
'<p style="margin-bottom:2px">NB :</p><textarea style="width:100%;min-height:50px;font:inherit;background:transparent;color:inherit;border:1px dashed var(--bd)" onchange="upd(\'nb\',this.value)">'+esc(cur.nb)+"</textarea></div></div>"+
'<p class="sm noprint">Merah = permintaan melebihi sisa pagu. Baris hijau = dana Silva. Data tersimpan otomatis di browser ini.</p>'}
function vRak(){var items=S.items.filter(function(i){return i.s==selS}),B=["JAN","FEB","MAR","APR","MEI","JUN","JUL","AGU","SEP","OKT","NOV","DES"],tot=[],gt=0,gp=0,i;
for(i=0;i<12;i++)tot.push(0);
var rows=items.map(function(it,n){var a=S.rak[it.id]||[],s=0,tds="";

return'<div class="bar">'+srcSel()+'<button onclick="window.print()">Cetak / PDF</button></div><div class="wrap"><h2 class="c" style="text-decoration:underline">RENCANA ANGGARAN KAS DESA</h2><p class="c" style="color:#d00;font-weight:600">SUMBER ANGGARAN : '+esc(sumber(selS).n.toUpperCase())+'</p><p class="c"><b>DESA '+esc(S.desa.toUpperCase())+" KECAMATAN "+esc(S.kec.toUpperCase())+"<br>TAHUN ANGGARAN "+S.tahun+'</b></p><div style="overflow-x:auto"><table style="min-width:1250px"><tr><th>NO</th><th>URAIAN</th><th>PAGU (Rp.)</th>'+B.map(function(b){return"<th>"+b+"</th>"}).join("")+'<th>JUMLAH RAK</th></tr>'+rows+'<tr><th colspan="2">JUMLAH (Rp.)</th><th class="n">'+fmt(gp)+"</th>"+tot.map(function(v){return'<th class="n">'+fmt(v)+"</th>"}).join("")+'<th class="n">'+fmt(gt)+'</th></tr></table></div></div><p class="sm noprint">Sel abu-abu = tidak ada rencana, sehingga tidak bisa dicairkan di bulan itu. Jumlah RAK merah = tidak sama dengan pagu di menu Pagu / Uraian. Pencairan di SPPD dibatasi RAK kumulatif s.d. bulan tanggal pencairan.</p>'}
function vPagu(){
