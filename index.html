<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplikasi SPPD Desa</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#667;--bd:#c9ced6;--ac:#1d5fd1;--hd:#e8ebf0;--bad:#c62828;--y:#ffc000;--g:#92d050;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e232a;--tx:#e8ebf0;--mu:#9aa;--bd:#3a424d;--ac:#6ea0ff;--hd:#2a313a;--bad:#ff7b7b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
header b{font-size:16px;margin-right:auto}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.on{background:var(--ac);color:#fff}
button.d{color:var(--bad)}
main{max-width:980px;margin:0 auto;padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
.sheet{min-width:720px}
.sheet h2{margin:0;text-align:center;font-size:20px;text-decoration:underline}
.c{text-align:center;margin:2px 0}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--bd);padding:4px 6px}
th{background:var(--hd);font-size:12px}
td.n{text-align:right;white-space:nowrap}
td input.num{width:110px;text-align:right}
tr.hl td{background:rgba(255,192,0,.35)}tr.sv td{background:rgba(146,208,80,.35)}
.bad{color:var(--bad);font-weight:600}
.sm{font-size:12px;color:var(--mu)}.gr{background:rgba(128,128,128,.4)}td input.m{width:84px;text-align:right}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:10px}
.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
.f input,.f select{width:100%}
td input{width:100%;border:0;padding:2px 4px;background:transparent}
@media print{header,.bar,.noprint{display:none!important}body{background:#fff;color:#000}.wrap{border:0;padding:0}td input{color:#000}:root{--card:#fff;--tx:#000;--bd:#000;--hd:#fff}}
@page{size:215mm 330mm;margin:10mm}
@page rak{size:330mm 215mm;margin:8mm}
.rakw{page:rak}
@media print{.rakx{overflow:visible!important}.rakt{min-width:0!important;width:100%;table-layout:fixed;font-size:9px}.rakt th,.rakt td{padding:2px 3px;font-size:9px}.rakt input.m{width:100%;font-size:9px;padding:0;border:0}.rakt th:nth-child(2),.rakt td:nth-child(2){width:20%}.gr{background:#bbb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sheet{min-width:0!important}}
.kop{display:flex;align-items:center;gap:12px}.kop img{width:86px;height:88px;object-fit:contain}.kt{flex:1;text-align:center;line-height:1.25;padding-right:86px}.k1{font-size:16px}.k2{font-size:20px;font-weight:700}.k3{font-size:10.5px}.kl{border-top:4px solid var(--tx);border-bottom:1px solid var(--tx);height:3px;margin:6px 0 12px}
</style></head><body>
<header class="noprint"><b>SPPD Desa</b>

function rst(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=JSON.parse(r.result);save();render()}catch(e){alert("File tidak valid")}};r.readAsText(f)}
document.querySelectorAll("header button[data-t]").forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});
boot();
</script></body></html>
